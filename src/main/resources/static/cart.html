<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Victor Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-danger" href="/index.html">
                <i class="fa-solid fa-bolt text-danger"></i> VICTOR<span class="text-dark">SPORT</span>
                <span class="brand-badge">PRO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="/index.html"><i class="fa-solid fa-house me-1"></i> Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/index.html#shop-section"><i class="fa-solid fa-store me-1"></i> Cửa hàng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/order-success.html"><i class="fa-solid fa-clock-rotate-left me-1"></i> Tra cứu đơn hàng</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/cart.html" class="cart-btn">
                        <i class="fa-solid fa-bag-shopping text-danger"></i>
                        <span>Giỏ hàng</span>
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Cart Content -->
    <div class="container my-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-cart-shopping text-danger me-2"></i> GIỎ HÀNG CỦA BẠN</h2>
            <span class="text-muted" id="totalItemsText">0 sản phẩm</span>
        </div>

        <div class="row g-4" id="cartContentArea">
            <!-- Dynamic Cart Content -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white pt-5 pb-4 border-top mt-5">
        <div class="container text-center small text-secondary">
            © 2026 DATN Victor Sport. Tất cả quyền được bảo lưu.
        </div>
    </footer>

    <!-- Bootstrap JS & App JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });

        function renderCart() {
            const items = CartManager.getItems();
            const container = document.getElementById('cartContentArea');
            const totalItemsText = document.getElementById('totalItemsText');

            totalItemsText.textContent = `${CartManager.getTotalCount()} sản phẩm`;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="p-5 bg-white rounded-4 border shadow-sm">
                            <i class="fa-solid fa-cart-arrow-down fa-4x text-muted mb-3"></i>
                            <h4 class="fw-bold">Giỏ hàng của bạn đang trống!</h4>
                            <p class="text-muted">Hãy lướt qua bộ sưu tập giày thể thao và chọn cho mình mẫu giày ưng ý nhất.</p>
                            <a href="/index.html#shop-section" class="btn btn-primary-sport px-4 py-2 mt-2">
                                <i class="fa-solid fa-store me-1"></i> Khám phá sản phẩm ngay
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const totalPrice = CartManager.getTotalPrice();
            const shipFee = totalPrice >= 1000000 ? 0 : 30000;
            const finalTotal = totalPrice + shipFee;

            const html = `
                <!-- Danh sách sản phẩm trong giỏ -->
                <div class="col-lg-8">
                    <div class="cart-card p-3 shadow-sm mb-3">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="min-width: 250px;">Sản phẩm</th>
                                        <th>Đơn giá</th>
                                        <th>Số lượng</th>
                                        <th>Thành tiền</th>
                                        <th class="text-center">Xóa</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.map(item => `
                                        <tr>
                                            <td>
                                                <div class="d-flex align-items-center gap-3">
                                                    <img src="${item.hinhAnh || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100'}" alt="${item.tenSanPham}" class="rounded-3 border" style="width: 70px; height: 70px; object-fit: cover;">
                                                    <div>
                                                        <a href="/product-detail.html?id=${item.idSanPham}" class="fw-bold text-dark text-decoration-none d-block">${item.tenSanPham}</a>
                                                        <small class="text-muted">
                                                            Phân loại: <span class="badge bg-light text-dark border">${item.mauSac}</span>
                                                            <span class="badge bg-light text-dark border">Size ${item.kichThuoc}</span>
                                                            <span class="badge bg-light text-dark border">${item.formChan}</span>
                                                        </small>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="fw-semibold">${formatVND(item.gia)}</td>
                                            <td>
                                                <div class="qty-control">
                                                    <button class="qty-btn" type="button" onclick="changeQty(${item.idChiTiet}, -1)">-</button>
                                                    <input type="number" class="qty-input" value="${item.soLuong}" readonly>
                                                    <button class="qty-btn" type="button" onclick="changeQty(${item.idChiTiet}, 1)">+</button>
                                                </div>
                                            </td>
                                            <td class="fw-bold text-danger">${formatVND(item.gia * item.soLuong)}</td>
                                            <td class="text-center">
                                                <button class="btn btn-outline-danger btn-sm rounded-circle" style="width: 32px; height: 32px; padding: 0;" onclick="deleteItem(${item.idChiTiet})" title="Xóa khỏi giỏ">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a href="/index.html#shop-section" class="btn btn-outline-sport">
                            <i class="fa-solid fa-arrow-left me-1"></i> Tiếp tục chọn mua
                        </a>
                        <button class="btn btn-outline-danger" onclick="clearCartConfirm()">
                            <i class="fa-solid fa-trash me-1"></i> Xóa toàn bộ giỏ hàng
                        </button>
                    </div>
                </div>

                <!-- Tóm tắt thanh toán -->
                <div class="col-lg-4">
                    <div class="cart-card p-4 shadow-sm">
                        <h5 class="fw-bold mb-3 border-bottom pb-2">TÓM TẮT ĐƠN HÀNG</h5>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Tạm tính:</span>
                            <span class="fw-bold">${formatVND(totalPrice)}</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Phí vận chuyển:</span>
                            <span class="fw-bold ${shipFee === 0 ? 'text-success' : ''}">
                                ${shipFee === 0 ? '<i class="fa-solid fa-gift me-1"></i> Miễn phí' : formatVND(shipFee)}
                            </span>
                        </div>

                        ${totalPrice < 1000000 ? `
                            <div class="alert alert-warning p-2 small mb-3">
                                <i class="fa-solid fa-circle-info me-1"></i> Mua thêm <strong>${formatVND(1000000 - totalPrice)}</strong> để được <strong>FREESHIP</strong> toàn quốc!
                            </div>
                        ` : `
                            <div class="alert alert-success p-2 small mb-3">
                                <i class="fa-solid fa-check-circle me-1"></i> Bạn đã đủ điều kiện nhận <strong>FREESHIP</strong>!
                            </div>
                        `}

                        <div class="border-top pt-3 mb-4 d-flex justify-content-between align-items-baseline">
                            <span class="fs-5 fw-bold">Tổng thanh toán:</span>
                            <span class="fs-4 fw-extrabold text-danger">${formatVND(finalTotal)}</span>
                        </div>

                        <a href="/checkout.html" class="btn btn-primary-sport w-100 py-3 fs-6">
                            TIẾN HÀNH THANH TOÁN <i class="fa-solid fa-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function changeQty(idChiTiet, delta) {
            CartManager.updateQuantity(idChiTiet, delta);
            renderCart();
        }

        function deleteItem(idChiTiet) {
            CartManager.removeItem(idChiTiet);
            renderCart();
        }

        function clearCartConfirm() {
            if (confirm('Bạn có chắc muốn xóa tất cả sản phẩm trong giỏ hàng không?')) {
                CartManager.clearCart();
                renderCart();
            }
        }
    </script>
</body>
</html>

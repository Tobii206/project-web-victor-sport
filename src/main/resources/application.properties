spring.application.name=DATN web Victor Sport

server.port=8080

# Chờ biên dịch xong trước khi tự khởi động lại ứng dụng.
spring.devtools.restart.poll-interval=6s
spring.devtools.restart.quiet-period=5s
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DATN_VictorSport;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Tai khoan nhan chuyen khoan QR (co the thay bang bien moi truong).
